<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820" width="1260" height="820">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6d28d9"/>
    </marker>
    <style>
      .title { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 13.5px; fill: #475569; }
      .h1 { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .h2 { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 14.5px; font-weight: bold; fill: #0f172a; }
      .h3 { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 13.5px; font-weight: bold; fill: #1e293b; }
      .body { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 12.5px; fill: #334155; }
      .small { font-family: Liberation Serif, Times New Roman, DejaVu Serif, serif; font-size: 11.5px; fill: #475569; }
      .badge { font-family: Liberation Sans, Arial, DejaVu Sans, sans-serif; font-size: 10.5px; font-weight: bold; letter-spacing: 0.4px; }
      .mono { font-family: Liberation Mono, DejaVu Sans Mono, monospace; font-size: 11.5px; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1260" height="820" fill="#ffffff"/>
  <rect x="16" y="16" width="1228" height="788" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="16" y="16" width="1228" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="630" y="39" text-anchor="middle" class="title">Two-Site Connectivity, Data Flow and Single-Point-of-Failure Architecture</text>
  <text x="630" y="58" text-anchor="middle" class="subtitle">Phase 1 Discovery Baseline (Sanitised Generic Identifiers · Zero Hostnames, Vendor Brands or Live IPs)</text>

  <!-- BRANCH 1 CONTAINER -->
  <rect x="36" y="88" width="465" height="608" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <rect x="36" y="88" width="465" height="40" rx="8" fill="#0f172a"/>
  <text x="268" y="114" text-anchor="middle" font-family="Liberation Serif, Times New Roman, DejaVu Serif, serif" font-size="14.5" font-weight="bold" fill="#ffffff">BRANCH-1 (HQ · Primary Datacenter Site)</text>

  <!-- Branch 1 WAN Edge -->
  <rect x="54" y="142" width="206" height="68" rx="5" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="157" y="163" text-anchor="middle" class="h3" fill="#9f1239">GW-B1-ISP1 (Floor 1)</text>
  <text x="157" y="181" text-anchor="middle" class="small">Serves Ground Floor LAN</text>
  <text x="157" y="197" text-anchor="middle" class="small" fill="#9f1239">No Auto-Failover to ISP 2</text>

  <rect x="276" y="142" width="206" height="68" rx="5" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="379" y="163" text-anchor="middle" class="h3" fill="#9f1239">GW-B1-ISP2 (Floor 2)</text>
  <text x="379" y="181" text-anchor="middle" class="small">Serves Second Floor LAN</text>
  <text x="379" y="197" text-anchor="middle" class="small" fill="#9f1239">Isolated Static Routing</text>

  <!-- Core Switch -->
  <line x1="157" y1="210" x2="220" y2="236" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="379" y1="210" x2="316" y2="236" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="54" y="238" width="428" height="58" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="268" y="261" text-anchor="middle" class="h3" fill="#1e3a8a">SW-B1-CORE · Managed Layer 2/3 Switch (802.1Q Trunks)</text>
  <text x="268" y="281" text-anchor="middle" font-family="Liberation Serif, Times New Roman, DejaVu Serif, serif" font-size="11" fill="#475569">VLAN 10 (Clinical) · VLAN 20 (Billing) · VLAN 30 (Imaging) · VLAN 100 (Srv)</text>

  <!-- Server Subnet VLAN 100 -->
  <rect x="54" y="314" width="428" height="236" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="1.6"/>
  <rect x="68" y="304" width="236" height="20" rx="3" fill="#1e40af"/>
  <text x="186" y="318" text-anchor="middle" class="badge" fill="#ffffff">SERVER SUBNET (VLAN 100)</text>

  <!-- DB Server SPOF -->
  <rect x="68" y="334" width="400" height="82" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="336" y="341" width="122" height="19" rx="3" fill="#b91c1c"/>
  <text x="397" y="354" text-anchor="middle" class="badge" fill="#ffffff">CRITICAL SPOF</text>
  <text x="80" y="356" class="h3" fill="#7f1d1d">DB-SERVER &amp; HIS-APP (Primary)</text>
  <text x="80" y="377" class="small">• On-premises relational DB &amp; shared hospital information system</text>
  <text x="80" y="394" class="small">• Holds 100% of EMR, registration, imaging metadata &amp; billing</text>
  <text x="80" y="410" class="small">• No high-availability cluster; serves both branches live</text>

  <!-- Linux Utility + Backup Staging -->
  <rect x="68" y="428" width="194" height="108" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="80" y="450" class="h3">LNX-UTIL &amp; DIR-SRV</text>
  <text x="80" y="470" class="small">• Linux DNS/DHCP appliance</text>
  <text x="80" y="487" class="small">• Directory &amp; print services</text>
  <text x="80" y="504" class="small">• Target for SSH &amp; host</text>
  <text x="80" y="521" class="small">  firewall hardening</text>

  <rect x="274" y="428" width="194" height="108" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="286" y="450" class="h3">BKP-STAGE &amp; IMG</text>
  <text x="286" y="470" class="small">• Nightly local DB dump</text>
  <text x="286" y="487" class="small">• Manual cold disk image</text>
  <text x="286" y="504" class="small">  (unscheduled; 5-mo RPO</text>
  <text x="286" y="521" class="small">  gap identified)</text>

  <!-- Branch 1 Access VLANs -->
  <rect x="54" y="566" width="428" height="114" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="268" y="588" text-anchor="middle" class="h3">Branch 1 Access VLANs (~45 Endpoints · 1 Gbps Local LAN)</text>
  <rect x="66" y="600" width="130" height="66" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="131" y="622" text-anchor="middle" class="small" font-weight="bold">VLAN 10: Clinical</text>
  <text x="131" y="640" text-anchor="middle" class="small">30 Doctor PCs</text>
  <text x="131" y="656" text-anchor="middle" class="small">&amp; Nursing Desks</text>

  <rect x="203" y="600" width="130" height="66" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="268" y="622" text-anchor="middle" class="small" font-weight="bold">VLAN 20: Billing</text>
  <text x="268" y="640" text-anchor="middle" class="small">15 Intake, Cashier</text>
  <text x="268" y="656" text-anchor="middle" class="small">&amp; Linux Kiosks</text>

  <rect x="340" y="600" width="130" height="66" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="405" y="622" text-anchor="middle" class="small" font-weight="bold">VLAN 30: Imaging</text>
  <text x="405" y="640" text-anchor="middle" class="small">Lab Analyzers &amp;</text>
  <text x="405" y="656" text-anchor="middle" class="small">X-Ray Terminals</text>

  <!-- CENTER COLUMN: Inter-site Tunnel & Domestic Cloud -->
  <rect x="530" y="160" width="200" height="225" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="630" y="186" text-anchor="middle" class="h3" fill="#854d0e">INTER-SITE WAN LINK</text>
  <text x="630" y="206" text-anchor="middle" class="mono">~30 km Separation</text>
  <line x1="546" y1="218" x2="714" y2="218" stroke="#eab308" stroke-width="1.4"/>
  <text x="630" y="238" text-anchor="middle" class="small" font-weight="bold">Site-to-Site IPsec VPN</text>
  <text x="630" y="255" text-anchor="middle" class="small">IKEv2 / ESP AES-256</text>
  <text x="630" y="272" text-anchor="middle" class="small">Over Public Broadband</text>
  <line x1="546" y1="286" x2="714" y2="286" stroke="#eab308" stroke-width="1.4"/>
  <text x="630" y="306" text-anchor="middle" class="small" fill="#9a3412" font-weight="bold">Findings:</text>
  <text x="630" y="323" text-anchor="middle" class="small">• Live SQL &amp; HIS traffic</text>
  <text x="630" y="340" text-anchor="middle" class="small">• No QoS shaping vs</text>
  <text x="630" y="356" text-anchor="middle" class="small">  bulk imaging transfers</text>
  <text x="630" y="372" text-anchor="middle" class="small">• No backup VPN tunnel</text>

  <!-- Domestic Cloud Box -->
  <rect x="530" y="425" width="200" height="190" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="630" y="451" text-anchor="middle" class="h3" fill="#14532d">CLD-BACKUP-KSA</text>
  <text x="630" y="470" text-anchor="middle" class="small" font-weight="bold">Domestic Cloud Storage</text>
  <text x="630" y="486" text-anchor="middle" class="small">(Riyadh Region · KSA)</text>
  <line x1="546" y1="498" x2="714" y2="498" stroke="#86efac" stroke-width="1.4"/>
  <text x="630" y="518" text-anchor="middle" class="small">• Daily post-shift upload</text>
  <text x="630" y="535" text-anchor="middle" class="small">• TLS 443 / AES-256</text>
  <text x="630" y="552" text-anchor="middle" class="small">• In-Kingdom PDPL OK</text>
  <text x="630" y="572" text-anchor="middle" class="small" fill="#9a3412">• Gap: Ad-hoc restore</text>
  <text x="630" y="588" text-anchor="middle" class="small" fill="#9a3412">  tests (last Apr 2026)</text>

  <line x1="470" y1="482" x2="528" y2="482" stroke="#15803d" stroke-width="2.4" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- BRANCH 2 CONTAINER -->
  <rect x="759" y="88" width="465" height="608" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="759" y="88" width="465" height="40" rx="8" fill="#334155"/>
  <text x="991" y="114" text-anchor="middle" font-family="Liberation Serif, Times New Roman, DejaVu Serif, serif" font-size="14.5" font-weight="bold" fill="#ffffff">BRANCH-2 (Satellite Clinic · Remote Consumer Site)</text>

  <!-- Branch 2 Single ISP -->
  <rect x="820" y="142" width="342" height="68" rx="5" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
  <text x="991" y="163" text-anchor="middle" class="h3" fill="#9f1239">GW-B2 · Single-ISP Edge Router &amp; VPN Endpoint</text>
  <text x="991" y="182" text-anchor="middle" class="small">Single Broadband Uplink (No Secondary WAN Failover)</text>
  <text x="991" y="198" text-anchor="middle" class="small" fill="#9f1239">WAN Edge SPOF: Link Drop Isolates Entire Satellite Clinic</text>

  <!-- Tunnel Connectors drawn on top of containers -->
  <line x1="484" y1="176" x2="528" y2="210" stroke="#b45309" stroke-width="2.3" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <line x1="732" y1="210" x2="818" y2="176" stroke="#b45309" stroke-width="2.3" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>

  <!-- Branch 2 Flat Switch -->
  <line x1="991" y1="210" x2="991" y2="236" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="777" y="238" width="428" height="64" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="991" y="261" text-anchor="middle" class="h3" fill="#92400e">SW-B2-FLAT · Unmanaged Access Switch (Drift Finding)</text>
  <text x="991" y="281" text-anchor="middle" class="small">Single Flat Broadcast Subnet · Zero 802.1Q VLAN Segmentation</text>
  <text x="991" y="296" text-anchor="middle" class="small" fill="#92400e">Clinical, Billing &amp; Lab Traffic Unsegmented at Layer 2</text>

  <!-- Branch 2 Server Status -->
  <rect x="777" y="320" width="428" height="214" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <rect x="792" y="336" width="398" height="74" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="991" y="360" text-anchor="middle" class="h3" fill="#991b1b">NO LOCAL DATABASE REPLICA AT BRANCH 2</text>
  <text x="991" y="380" text-anchor="middle" class="small">100% of EMR reads, patient registrations &amp; invoices query</text>
  <text x="991" y="397" text-anchor="middle" class="small">Branch 1 DB-SERVER synchronously across the IPsec tunnel</text>

  <rect x="792" y="424" width="398" height="94" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="808" y="447" class="h3">SRV-B2-UTIL · Local File &amp; Print Server</text>
  <text x="808" y="467" class="small">• Hosts local scan folders &amp; receipt/barcode print queues</text>
  <text x="808" y="485" class="small" fill="#92400e">• Configuration Drift: Older Server OS build &amp; patch level</text>
  <text x="808" y="502" class="small" fill="#92400e">  compared with Branch 1 (Target for Phase 4 Ansible parity)</text>

  <!-- Branch 2 Endpoints -->
  <rect x="777" y="550" width="428" height="130" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="991" y="573" text-anchor="middle" class="h3">Branch 2 Clinic Endpoints (~20 Workstations · Flat LAN)</text>
  <rect x="792" y="586" width="192" height="78" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="888" y="610" text-anchor="middle" class="small" font-weight="bold">Consultation Rooms (14)</text>
  <text x="888" y="628" text-anchor="middle" class="small">HIS Client ("Branch 2" profile)</text>
  <text x="888" y="646" text-anchor="middle" class="small">Live SQL over IPsec Tunnel</text>

  <rect x="998" y="586" width="192" height="78" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1094" y="610" text-anchor="middle" class="small" font-weight="bold">Intake &amp; Cashier (6)</text>
  <text x="1094" y="628" text-anchor="middle" class="small">Patient Check-in &amp; Billing</text>
  <text x="1094" y="646" text-anchor="middle" class="small">Reverts to Paper if Tunnel Drops</text>

  <!-- Bottom Legend & Impact Bar -->
  <rect x="36" y="712" width="1188" height="76" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="54" y="736" class="h3">Architectural Risk Summary:</text>
  <text x="248" y="736" class="body">(1) Branch 1 DB-SERVER is an unclustered Single Point of Failure for both sites.</text>
  <text x="54" y="758" class="body">(2) Branch 1 Dual-ISP links are split by floor without automated failover.  (3) Branch 2 lacks local DB caching and L2 VLAN segmentation.</text>
  <text x="54" y="777" class="small">Legend:   [Red Border] Single Point of Failure / Availability Gap    ·    [Amber Border] Inter-Site Transit / Configuration Drift    ·    [Green Dashed] Encrypted PDPL Backup</text>
</svg>
